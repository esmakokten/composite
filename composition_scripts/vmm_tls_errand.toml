[system]
description = "TLS key errand: guest vmcall slot 0 -> pong (null service), slot 1 -> tlskey (BearSSL AES-GCM outside the VM)"
# Guest issues vmcall(fn=0, a0, a1) → kernel dispatches to pong server via sinv_call(thd_curr)
# Server executes on thd_curr, sret → sret_ret detects THD_TYPE_VM → vmx_resume

[[components]]
name = "booter"
img  = "no_interface.llbooter"
implements = [{interface = "init"}, {interface = "addr"}]
deps = [{srv = "kernel", interface = "init", variant = "kernel"}]
constructor = "kernel"

[[components]]
name = "capmgr"
img  = "capmgr.simple"
deps = [{srv = "booter", interface = "init"}, {srv = "booter", interface = "addr"}]
implements = [{interface = "capmgr"}, {interface = "init"}, {interface = "memmgr"}, {interface = "capmgr_create"}, {interface = "contigmem"}]
constructor = "booter"
baseaddr = "0x1000000"

[[components]]
name = "sched"
img  = "sched.pfprr_quantum_static"
deps = [{srv = "capmgr", interface = "init"}, {srv = "capmgr", interface = "capmgr"}, {srv = "capmgr", interface = "memmgr"}]
implements = [{interface = "sched"}, {interface = "syncipc"}, {interface = "init"}]
constructor = "booter"
baseaddr = "0x1600000"

[[components]]
name = "pong"
img  = "pong.pingpong"
deps = [{srv = "sched", interface = "init"}, {srv = "sched", interface = "sched"}, {srv = "capmgr", interface = "capmgr"}, {srv = "capmgr", interface = "memmgr"}]
implements = [{interface = "pong"}]
constructor = "booter"
baseaddr = "0x3000000"

[[components]]
name = "tlskey"
img  = "tlskey.bearssl"
deps = [{srv = "sched", interface = "init"}, {srv = "sched", interface = "sched"}, {srv = "capmgr", interface = "capmgr"}, {srv = "capmgr", interface = "memmgr"}]
implements = [{interface = "tlskey"}]
constructor = "booter"
baseaddr = "0x3400000"

[[components]]
name = "vmm"
img  = "simple_vmm.vmm"
deps = [
  {srv = "sched",   interface = "sched"},
  {srv = "sched",   interface = "init"},
  {srv = "capmgr",  interface = "capmgr"},
  {srv = "capmgr",  interface = "memmgr"},
  {srv = "capmgr",  interface = "contigmem"},
  {srv = "pong",    interface = "pong"},
  {srv = "tlskey",  interface = "tlskey"},
]
implements = []
constructor = "booter"
baseaddr = "0x2000000"
# the tls-errand recipe of cos-vmimg (branch w5/tls-image), installed with INSTALL_NAMED=1
constants = [{variable = "VM_GUEST_IMAGE", value = "\"guest/vmlinux-tls-errand-5.15.107.img\""}]
